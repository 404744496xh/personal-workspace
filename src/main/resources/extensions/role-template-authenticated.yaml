apiVersion: v1alpha1
kind: Role
metadata:
  name: personal-workspace-authenticated
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
rules:
  - apiGroups: ["api.workspace.halo.run"]
    resources: ["todos", "projects", "projects/modules", "commands", "notes", "images", "search", "backup"]
    verbs: ["get", "list", "create", "update", "delete"]
