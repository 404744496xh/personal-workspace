apiVersion: v1alpha1
kind: Role
metadata:
  name: personal-workspace-authenticated
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
  annotations:
    rbac.authorization.halo.run/display-name: "工作台用户"
    rbac.authorization.halo.run/module: "个人工作台"
rules:
  - apiGroups: ["api.workspace.halo.run"]
    resources: ["todos", "projects", "projects/modules", "commands", "notes", "images", "search", "report", "backup", "changes"]
    verbs: ["get", "list", "create", "update", "delete"]
