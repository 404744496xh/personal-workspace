apiVersion: v1alpha1
kind: Setting
metadata:
  name: personal-workspace-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: collapseShortcut
          label: 折叠全部快捷键
          help: 依次按下的键，用 + 分隔（如 z+d+v）。在工作台且焦点不在输入框或编辑器时生效，用于折叠/展开侧栏与时间筛选，不影响笔记内部。
          value: z+d+v
        - $formkit: text
          name: quickTodoShortcut
          label: 新建待办快捷键
          help: 依次按下的键，用 + 分隔（如 n+t）。在工作台且焦点不在输入框或编辑器时生效，按下后切到待办页并打开新建表单。
          value: n+t
        - $formkit: text
          name: searchShortcut
          label: 全局搜索快捷键
          help: 依次按下的键，用 + 分隔（如 s+s）。按下后聚焦左下角的全局搜索框。
          value: s+s
    - group: ai
      label: AI 与报告
      formSchema:
        - $formkit: text
          name: aiBaseUrl
          label: 接口地址（OpenAI 兼容）
          help: 例如 https://api.deepseek.com/v1、https://dashscope.aliyuncs.com/compatible-mode/v1，不需要带 /chat/completions。
        - $formkit: text
          name: aiModel
          label: 模型名
          help: 例如 deepseek-chat、qwen-plus、gpt-4o-mini。
        - $formkit: password
          name: aiApiKey
          label: API Key
          help: 只保存在 Halo 后台插件设置里，仅在服务端调用时使用；留空则关闭 AI 识别。
        - $formkit: textarea
          name: reportTemplate
          label: 周报 / 月报结构模板
          help: 用 Markdown 标题定义报告结构，可写每节要点与写作要求。留空使用内置研发模板。
          rows: 16
          value: |
            写作要求（不要输出本段）：务实具体、少套话，不使用「赋能、闭环、抓手、持续深耕」等词；正文 900-1600 字。

            ## 一、结论
            用 2-3 句话给出整体状态（正常 / 有风险）、本期最重要的结果与最大风险，结论先行，并带上关键数字（新增 / 完成 / 不用处理、项目数）。仅当存在超过 7 天未完成、高优先级未完成或明显逾期时判为「有风险」；没有明确证据不要写「已阻塞」。

            ## 二、目标与进度
            Markdown 表格：项目 | 状态 | 本期进展 | 剩余工作。覆盖仍有剩余工作或本期有动向的项目；没有可靠百分比时用阶段或交付物描述，不编造百分比。

            ## 三、关键交付与成果
            3-5 条（数据不足时可减少）。每条写成「做了什么 → 结果/影响」，合并同类事项；优先写已完成、已验证或已交付的结果，不要逐条抄待办标题。

            ## 四、风险、阻塞与资源需求
            有风险时用 Markdown 表格：风险 | 影响 | 建议应对 | 需要支持。只能基于数据中的逾期、长期未完成、高优先级未完成、进度停滞等线索；需要支持无法从数据判断时填「待确认」。没有风险时写「暂无明显阻塞」。

            ## 五、下期计划
            3-5 条，按优先级排序（高/中/低）。来自未完成待办和项目剩余工作，每条写清预期结果或检查点；不要写「继续推进」这类无法验收的表述。

            ## 六、知识沉淀
            2-4 条，从本期笔记中提炼可复用的方案、结论或经验；没有笔记时省略本节。
